<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Бригада — учёт заказов и смен</title>
<script src="https://telegram.org/js/telegram-web-app.js" onerror="void 0"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Inter:wght@400;500;600;700&display=swap');
:root{
  --bg:#F3F3F4; --card:#FFFFFF; --card2:#F1F0EE; --line:#DCDCDD; --line2:#C5C3C6;
  --ink:#14110F; --dim:#7E7F83; --faint:#A6A6A9;
  --teal:#1985A1; --teal-dark:#136B82; --slate:#4C5C68; --sand:#D9C5B2; --sand-dark:#9C7B54;
  --brown:#34312D; --danger:#C0392B;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg)}
body{
  color:var(--ink); font-family:'Inter',system-ui,sans-serif; font-size:16px; line-height:1.45;
  max-width:560px; margin:0 auto; padding-bottom:calc(84px + env(safe-area-inset-bottom));
  min-height:100vh;
}
input,textarea,button,select{font-family:inherit}
button{cursor:pointer}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

header{padding:14px 20px 0;display:flex;justify-content:space-between;align-items:center}
.brand{font-size:13px;font-weight:600;letter-spacing:.08em;color:var(--dim);text-transform:uppercase}
.brand i{display:inline-block;width:10px;height:10px;background:var(--teal);border-radius:3px;margin-right:7px;vertical-align:baseline}
.storage-badge{font-size:11px;color:var(--faint)}
main{padding:6px 20px 16px}

.page-title{
  font-family:'Lora',Georgia,serif;font-weight:700;font-size:28px;line-height:1.2;
  margin:14px 0 4px;display:flex;align-items:center;gap:10px;
}
.page-title .emo{font-size:26px}
.page-sub{color:var(--dim);font-size:14px;margin-bottom:16px}
.sec{
  color:var(--dim);font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  margin:20px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line);
}

.tabbar{
  position:fixed;bottom:0;left:0;right:0;max-width:560px;margin:0 auto;display:flex;
  background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);z-index:20;
}
.tabbar button{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:9px 0 11px;background:none;border:none;color:var(--dim);font-size:10.5px;font-weight:500;
  border-top:2px solid transparent;
}
.tabbar button .ic{font-size:19px;line-height:1.2}
.tabbar button.active{color:var(--ink);border-top-color:var(--teal)}

.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
.callout{
  background:var(--card2);border-radius:10px;padding:12px 14px;margin:12px 0;
  color:var(--dim);font-size:13.5px;line-height:1.5;display:flex;gap:10px;
}
.callout .emo{flex-shrink:0}
.empty{color:var(--dim);padding:18px 4px;line-height:1.55;font-size:15px}
label{display:block;color:var(--dim);font-size:13px;font-weight:500;margin:10px 0 6px}
input.f,select.f{
  width:100%;background:var(--card);border:1px solid var(--line2);border-radius:9px;
  color:var(--ink);padding:12px;font-size:16px;min-height:48px;
}
input.f:focus{outline:2px solid var(--teal);outline-offset:-1px;border-color:transparent}
.row2{display:flex;gap:10px;margin-top:12px}
.row2>*{flex:1}

.btn{border:none;border-radius:10px;font-size:15.5px;font-weight:600;min-height:48px;padding:12px 16px}
.btn-primary{background:var(--teal);color:#fff}
.btn-primary:active{background:var(--teal-dark)}
.btn-primary:disabled{opacity:.4}
.btn-big{width:100%;min-height:52px;font-size:16.5px;margin-bottom:12px}
.btn-outline{background:var(--card);color:var(--teal);border:1.5px solid var(--teal)}
.btn-ghost{background:var(--card);color:var(--dim);border:1px solid var(--line);font-weight:500}
.btn-danger{background:var(--danger);color:#fff}
.back{background:none;border:none;color:var(--dim);font-size:15px;padding:10px 0;display:block}

.list-card{
  display:block;width:100%;text-align:left;background:var(--card);
  border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:8px;color:var(--ink);
}
.list-card:active{background:var(--card2)}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}
.order-num{font-weight:700;font-size:16.5px}
.meta{color:var(--dim);font-size:13px;margin-top:3px}
.mono{font-variant-numeric:tabular-nums;font-weight:700}
.money{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink)}
.money-big{font-size:18px}
.money-huge{font-family:'Lora',Georgia,serif;font-size:40px;font-weight:700;margin:2px 0;letter-spacing:-0.01em}

.chip{border:1px solid;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:600;display:inline-block;background:transparent}
.chip-btn{border:1.5px solid;border-radius:8px;padding:10px 15px;font-size:15px;font-weight:600;min-height:44px;background:var(--card)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 6px}

.line-row{display:flex;justify-content:space-between;padding:6px 0;font-size:15px;gap:8px;border-bottom:1px solid var(--card2)}
.line-row:last-child{border-bottom:none}

.person-row{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:5px 10px;margin-bottom:8px}
.person-row.on{border-color:var(--teal);background:#F2FAFB}
.person-toggle{flex:1;display:flex;align-items:center;gap:12px;background:none;border:none;color:var(--ink);font-size:16px;padding:10px 0;text-align:left;min-height:48px}
.checkbox{width:24px;height:24px;border-radius:6px;border:1.5px solid var(--line2);display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:14px;flex-shrink:0;background:var(--card)}
.person-row.on .checkbox{background:var(--teal);border-color:var(--teal)}
.amount-input{width:100px;background:var(--card);border:1px solid var(--line2);border-radius:9px;color:var(--ink);padding:10px 8px;font-size:16px;text-align:right;font-variant-numeric:tabular-nums;font-weight:700;min-height:44px}

/* календарь */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin:6px 0 10px}
.cal-nav{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:10px;width:46px;height:46px;font-size:20px}
.cal-title{font-family:'Lora',Georgia,serif;font-weight:700;font-size:19px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-dow{text-align:center;color:var(--faint);font-size:11.5px;font-weight:600;padding:4px 0}
.cal-cell{
  background:var(--card);border:1.5px solid var(--line);border-radius:9px;color:var(--ink);
  padding:7px 0 5px;font-size:14.5px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:50px;
}
.cal-cell.today{border-color:var(--teal)}
.cal-cell.sel{background:var(--ink);color:#fff;border-color:var(--ink)}
.cal-cell:disabled{visibility:hidden}
.dots{display:flex;gap:2px;justify-content:center;min-height:6px;flex-wrap:wrap;max-width:34px}
.dot{width:6px;height:6px;border-radius:3px}
.dot.plan{background:transparent;border:1.5px solid var(--faint);width:5px;height:5px}
.cal-cell.sel .dot.plan{border-color:#999}

/* лента дня */
.tl{position:relative;padding-left:62px;margin-top:8px}
.tl:before{content:'';position:absolute;left:50px;top:6px;bottom:6px;width:2px;background:var(--line);border-radius:1px}
.tl-item{position:relative;margin-bottom:10px}
.tl-time{position:absolute;left:-62px;top:12px;width:44px;text-align:right;color:var(--dim);font-size:12.5px;font-variant-numeric:tabular-nums;line-height:1.35;font-weight:500}
.tl-node{position:absolute;left:-16px;top:16px;width:10px;height:10px;border-radius:5px;background:var(--bg);border:2px solid var(--line2)}
.tl-item.fact .tl-node{border-color:var(--teal);background:var(--teal)}
.plan-card{
  display:block;width:100%;text-align:left;background:transparent;color:var(--ink);
  border:1.5px dashed var(--line2);border-radius:10px;padding:11px 13px;
}
.plan-card .op{font-size:14.5px;line-height:1.4}
.plan-card .client{color:var(--faint);font-size:12px;margin-top:2px}
.fact-card{
  display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);
  border:1px solid var(--line);border-radius:10px;padding:11px 13px;
}
.badge-order{font-size:12.5px;font-weight:700;color:var(--sand-dark);letter-spacing:.02em;white-space:nowrap}
.badge-done{color:var(--teal);font-size:12px;font-weight:700}
.tl-add{color:var(--teal);font-weight:700;font-size:13px;white-space:nowrap}

/* отчёт — как code-block в Notion */
.paper{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:14px}
.paper textarea{width:100%;border:none;outline:none;resize:none;background:transparent;color:var(--ink);font-family:ui-monospace,'SF Mono','Courier New',monospace;font-size:14px;line-height:1.6;padding:12px}

.del-x{background:var(--card);border:1px solid var(--line);color:var(--faint);border-radius:9px;width:40px;height:40px;font-size:15px;flex-shrink:0}
.toast{
  position:fixed;bottom:calc(96px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
  background:var(--ink);color:#fff;font-weight:600;font-size:14.5px;
  padding:12px 20px;border-radius:10px;z-index:50;white-space:nowrap;box-shadow:0 6px 24px rgba(20,17,15,.25);
}
.warn-banner{background:#FBF4EA;border:1px solid var(--sand);color:var(--sand-dark);border-radius:10px;padding:11px 13px;font-size:13px;line-height:1.5;margin-bottom:12px}

/* главная */
.home-hero{margin:16px 0 4px}
.home-date{color:var(--dim);font-size:14px;font-weight:500}
.home-hello{font-family:'Lora',Georgia,serif;font-weight:700;font-size:30px;line-height:1.15;margin:4px 0 0}
.stat-row{display:flex;gap:10px;margin-bottom:12px}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 14px}
.stat .lbl{color:var(--dim);font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.stat .val{font-family:'Lora',Georgia,serif;font-size:24px;font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums}
.qa-row{display:flex;gap:10px;margin:4px 0 6px}
.qa{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 10px;color:var(--ink);font-weight:600;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:6px}
.qa .emo{font-size:22px}
.qa:active{background:var(--card2)}
.today-item{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;width:100%;text-align:left;color:var(--ink)}
.today-item .tm{font-variant-numeric:tabular-nums;color:var(--dim);font-size:13px;font-weight:600;width:44px;flex-shrink:0}
.today-item .tt{flex:1;font-size:14.5px}
</style>
</head>
<body>
<header>
  <div class="brand"><i></i>Бригада</div>
  <div class="storage-badge" id="storageBadge"></div>
</header>
<main id="main"></main>
<nav class="tabbar" id="tabbar"></nav>
<input type="file" id="xlsInput" accept=".xls,.xlsx" style="display:none">
<div id="toastBox"></div>

<script>
/* ================= Telegram ================= */
const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
if (tg) { try { tg.ready(); tg.expand(); tg.setHeaderColor && tg.setHeaderColor('#F3F3F4'); tg.setBackgroundColor && tg.setBackgroundColor('#F3F3F4'); } catch(e){} }

/* ================= Хранилище (Telegram Cloud → артефакт → память) ================= */
const KEY = 'brigada-v2';
const CHUNK = 3500;
let backend = 'memory';
if (tg && tg.CloudStorage && tg.isVersionAtLeast && tg.isVersionAtLeast('6.9')) backend = 'tg';
else if (window.storage) backend = 'artifact';

const cloud = {
  get: (k) => new Promise((res) => { try { tg.CloudStorage.getItem(k, (e, v) => res(e ? null : v)); } catch { res(null); } }),
  set: (k, v) => new Promise((res) => { try { tg.CloudStorage.setItem(k, v, () => res()); } catch { res(); } }),
};
let memoryStore = null;

async function loadData() {
  try {
    if (backend === 'tg') {
      const n = parseInt(await cloud.get(KEY + ':n') || '0', 10);
      if (!n) return null;
      let s = '';
      for (let i = 0; i < n; i++) s += (await cloud.get(KEY + ':' + i)) || '';
      return s ? JSON.parse(s) : null;
    }
    if (backend === 'artifact') {
      const r = await window.storage.get(KEY).catch(() => null);
      return r && r.value ? JSON.parse(r.value) : null;
    }
    return memoryStore;
  } catch { return null; }
}
async function persist(data) {
  const json = JSON.stringify(data);
  try {
    if (backend === 'tg') {
      const n = Math.ceil(json.length / CHUNK) || 1;
      for (let i = 0; i < n; i++) await cloud.set(KEY + ':' + i, json.slice(i * CHUNK, (i + 1) * CHUNK));
      await cloud.set(KEY + ':n', String(n));
    } else if (backend === 'artifact') {
      await window.storage.set(KEY, json);
    } else {
      memoryStore = data;
    }
  } catch { toast('Не удалось сохранить'); }
}

/* ================= Утилиты ================= */
const DEFAULT_TYPES = ['Монтаж', 'Демонтаж', 'Транспорт', 'Склад'];
const TYPE_COLORS = { 'Монтаж': 'var(--teal)', 'Демонтаж': 'var(--slate)', 'Транспорт': 'var(--dim)', 'Склад': 'var(--sand-dark)' };
const tColor = (t) => TYPE_COLORS[t] || 'var(--brown)';
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
const fmtMoney = (n) => (Number(n) || 0).toLocaleString('ru-RU');
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtD = (iso) => { if (!iso) return ''; const [y,m,d] = iso.split('-'); return `${d}.${m}.${y.slice(2)}`; };
const MONTHS = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const MONTHS_G = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MONTHS_R = { 'января':1,'февраля':2,'марта':3,'апреля':4,'мая':5,'июня':6,'июля':7,'августа':8,'сентября':9,'октября':10,'ноября':11,'декабря':12 };
const DOW = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const DOW_FULL = ['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
const plural = (n, a, b, c) => { const m10=n%10, m100=n%100; if(m10===1&&m100!==11)return a; if(m10>=2&&m10<=4&&(m100<12||m100>14))return b; return c; };
const workTotal = (w) => w.lines.reduce((s,l)=>s+(Number(l.amount)||0),0);
const orderTotal = (o) => o.works.reduce((s,w)=>s+workTotal(w),0);
// касса бригадира: сколько выдано на руки и сколько осело у бригадира
const lineCash = (l) => (l.cash == null ? (Number(l.amount)||0) : (Number(l.cash)||0)); // на руки; по умолчанию = по отчёту
const workCash = (w) => w.lines.reduce((s,l)=>s+lineCash(l),0);
const workKassa = (w) => workTotal(w) - workCash(w);
const orderCash = (o) => o.works.reduce((s,w)=>s+workCash(w),0);
const orderKassa = (o) => orderTotal(o) - orderCash(o);
const todayISO = () => { const n = new Date(); return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`; };

function guessType(op) {
  const s = (op||'').toLowerCase();
  if (/доставк|транспортировк|вывоз упаковк|перевозк/.test(s)) return 'Транспорт';
  if (s.includes('демонтаж')) return 'Демонтаж';
  if (s.includes('монтаж')) return 'Монтаж';
  if (/погрузк|отгрузк|склад|прием|принять/.test(s)) return 'Склад';
  return 'Монтаж';
}

/* ================= Ленивая загрузка SheetJS ================= */
let xlsxLoading = null;
function ensureXLSX() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  if (xlsxLoading) return xlsxLoading;
  const mirrors = [
    'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',
    'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js',
    'https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js',
  ];
  xlsxLoading = new Promise((resolve, reject) => {
    let i = 0;
    const tryNext = () => {
      if (i >= mirrors.length) { reject(new Error('cdn')); return; }
      const s = document.createElement('script');
      s.src = mirrors[i++];
      s.onload = () => window.XLSX ? resolve(window.XLSX) : tryNext();
      s.onerror = tryNext;
      document.head.appendChild(s);
    };
    tryNext();
  });
  return xlsxLoading;
}

/* ================= Парсер календаря 1С ================= */
function parsePlanWorkbook(wb, XLSX) {
  const ws = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: false, defval: '' });
  const events = [];
  let curDate = null;
  const dayRe = new RegExp('(\\d{1,2})\\s+(' + Object.keys(MONTHS_R).join('|') + ')\\s+(\\d{4})');
  for (const row of rows) {
    const cells = row.map((c) => String(c == null ? '' : c));
    const joined = cells.join(' ');
    const dm = joined.match(dayRe);
    if (dm && /Понедельник|Вторник|Среда|Четверг|Пятница|Суббота|Воскресенье/.test(cells[0])) {
      curDate = `${dm[3]}-${String(MONTHS_R[dm[2]]).padStart(2,'0')}-${String(dm[1]).padStart(2,'0')}`;
      continue;
    }
    const times = [...cells[0].matchAll(/(\d{1,2})\s*:\s*(\d{2})/g)];
    if (curDate && times.length) {
      const from = String(+times[0][1]).padStart(2,'0') + ':' + times[0][2];
      const to = times.length > 1 ? String(+times[1][1]).padStart(2,'0') + ':' + times[1][2] : null;
      const opCell = cells.slice(1).find((c) => c.trim()) || '';
      const opLines = opCell.split('\n').map((l) => l.trim()).filter(Boolean);
      const om = joined.match(/заказ\s*№?\s*(\d+)/i);
      events.push({
        id: uid(), date: curDate, from, to,
        op: opLines[0] || 'Работа', client: opLines[1] || '',
        order: om ? om[1] : null,
      });
    }
  }
  // в план берём только монтажи и демонтажи — транспорт и склад не засоряют календарь
  return events.filter((e) => {
    const t = guessType(e.op);
    return t === 'Монтаж' || t === 'Демонтаж';
  });
}

/* ================= Состояние ================= */
let D = null; // {people, types, orders, plan}
let view = { tab: 'home', orderId: null, work: null, report: false, ym: null, selDay: null, sumYm: null, confirm: null, addingOrder: false, editPerson: null };
let toastTimer = null;

function toast(msg) {
  clearTimeout(toastTimer);
  document.getElementById('toastBox').innerHTML = `<div class="toast">${esc(msg)}</div>`;
  toastTimer = setTimeout(() => (document.getElementById('toastBox').innerHTML = ''), 2200);
}
async function save() { await persist(D); }

/* ================= Рендер ================= */
function render() {
  const main = document.getElementById('main');
  try { renderInner(main); }
  catch (err) {
    main.innerHTML = `<div class="card"><b>Что-то пошло не так.</b>
      <div style="margin:8px 0 12px;color:var(--dim)">Не удалось отрисовать экран. Попробуй переключить вкладку или перезапустить.</div>
      <button class="btn btn-primary" onclick="location.reload()">Перезапустить</button></div>`;
    renderTabbar();
  }
}
function renderInner(main) {
  let html = '';
  if (view.tab === 'home') html = renderHome();
  else if (view.tab === 'plan') html = renderPlan();
  else if (view.tab === 'orders') html = view.work !== null ? renderWorkForm() : view.report ? renderReport() : view.orderId ? renderOrder() : renderOrders();
  else if (view.tab === 'people') html = renderPeople();
  else if (view.tab === 'summary') html = renderSummary();
  main.innerHTML = html;
  bindMain();

/* ---------- ГЛАВНАЯ ---------- */
function monthStats(year, month) {
  const inMonth = (iso) => { if (!iso) return false; const [y,m] = iso.split('-').map(Number); return y===year && m===month+1; };
  let total = 0, kassa = 0; const orderSet = new Set(); let works = 0;
  for (const o of D.orders) {
    const active = o.works.some((w) => inMonth(w.date));
    for (const w of o.works) {
      if (!(inMonth(w.date) || (!w.date && active))) continue;
      works++; orderSet.add(o.id); total += workTotal(w); kassa += workKassa(w);
    }
  }
  return { total, orders: orderSet.size, works, kassa };
}

  const now = new Date();

  </div>`;

  const plans = D.plan.filter((p) => p.date === t).sort((a,b)=>a.from.localeCompare(b.from));

    html += `<div class="callout"><span class="emo">☕️</span><span>На сегодня ничего не запланировано и не оформлено. Загляни в «План», если ждёшь монтажей.</span></div>`;
  }

      <span class="tl-add">оформить</span>

  const recent = D.orders.slice(0, 3);
  if (recent.length) {

      html += `<button class="list-card" data-order-home="${o.id}">

/* ---------- ПЛАН ---------- */
function ymNow() { const n = new Date(); return [n.getFullYear(), n.getMonth()]; }

function factsByDay(year, month) {
  const map = {};
  for (const o of D.orders) for (const w of o.works) {
    if (!w.date) continue;
    const [y,m,d] = w.date.split('-').map(Number);
    if (y === year && m === month + 1) (map[d] = map[d] || []).push({ order: o, work: w });
  }
  return map;
}
function plansByDay(year, month) {
  const map = {};
  for (const p of D.plan) {
    const [y,m,d] = p.date.split('-').map(Number);
    if (y === year && m === month + 1) (map[d] = map[d] || []).push(p);
  }
  return map;
}
function planIsDone(p) {
  return D.orders.some((o) => o.num === p.order && o.works.some((w) => w.planId === p.id));
}

function calendarGrid(year, month, byDayFact, byDayPlan, selDay) {
  const now = new Date();
  const startDow = (new Date(year, month, 1).getDay() + 6) % 7;
  const daysIn = new Date(year, month + 1, 0).getDate();
  let cells = '';
  for (let i = 0; i < startDow; i++) cells += `<button class="cal-cell" disabled></button>`;
  for (let d = 1; d <= daysIn; d++) {
    const today = year === now.getFullYear() && month === now.getMonth() && d === now.getDate();
    const facts = byDayFact[d] || [];
    const plans = byDayPlan[d] || [];
    const factTypes = [...new Set(facts.map((x) => x.work.type))].slice(0, 3);
    let dots = factTypes.map((t) => `<span class="dot" style="background:${tColor(t)}"></span>`).join('');
    if (plans.length && factTypes.length < 3) dots += `<span class="dot plan"></span>`;
    cells += `<button class="cal-cell ${today?'today':''} ${selDay===d?'sel':''}" data-day="${d}">
      <span>${d}</span><span class="dots">${dots}</span></button>`;
  }
  return `
    <div class="cal-head">
      <button class="cal-nav" data-nav="cal-1">‹</button>
      <div class="cal-title">${MONTHS[month]} ${year}</div>
      <button class="cal-nav" data-nav="cal+1">›</button>
    </div>
    <div class="cal-grid">${DOW.map((d)=>`<div class="cal-dow">${d}</div>`).join('')}${cells}</div>`;
}

function renderPlan() {
  if (!view.ym) view.ym = ymNow();
  const [year, month] = view.ym;
  const byF = factsByDay(year, month), byP = plansByDay(year, month);

  let html = `<div class="page-title"><span class="emo">📅</span>План</div>
  <div class="page-sub">Монтажи и демонтажи из 1С плюс оформленные работы</div>`;
  html += calendarGrid(year, month, byF, byP, view.selDay);
  html += `<div class="row2" style="margin:14px 0 0">
    <button class="btn btn-outline" id="importBtn">⤓ Загрузить календарь 1С</button>
  </div>
  <div class="callout"><span class="emo">💡</span><span>Из выгрузки берутся только монтажи и демонтажи — транспорт и склад не засоряют план. Сплошная точка — оформленная работа, пустая — план.</span></div>`;

  if (view.selDay) {
    const d = view.selDay;
    const plans = (byP[d] || []).slice().sort((a,b) => a.from.localeCompare(b.from));
    const facts = (byF[d] || []).slice().sort((a,b) => (a.work.from||'').localeCompare(b.work.from||''));
    html += `<div class="sec">${d} ${MONTHS_G[month]}</div>`;

    const perOrders = {};
    for (const { order, work } of facts) for (const l of work.lines) {
      (perOrders[l.name] = perOrders[l.name] || new Set()).add(order.num);
    }
    const busy = Object.entries(perOrders).filter(([,s]) => s.size > 1);
    if (busy.length) {
      html += `<div class="warn-banner">В двух и более заказах сегодня: ${busy.map(([n,s]) => `${esc(n)} (№${[...s].join(', №')})`).join('; ')}. Это разрешено — просто держи занятость в голове.</div>`;
    }

    if (!plans.length && !facts.length) html += `<div class="empty">На этот день нет ни плана, ни работ.</div>`;
    html += `<div class="tl">`;
    for (const p of plans) {
      const done = planIsDone(p);
      html += `<div class="tl-item"><div class="tl-time">${p.from}${p.to ? '<br>' + p.to : ''}</div><div class="tl-node"></div>
        <button class="plan-card" data-plan="${p.id}">
          <div class="spread"><span class="badge-order">ЗАКАЗ №${esc(p.order || '—')}</span>
          ${done ? '<span class="badge-done">✓ оформлено</span>' : '<span class="tl-add">+ оформить</span>'}</div>
          <div class="op">${esc(p.op)}</div>
          ${p.client ? `<div class="client">${esc(p.client)}</div>` : ''}
        </button></div>`;
    }
    for (const { order, work } of facts) {
      html += `<div class="tl-item fact"><div class="tl-time">${work.from || '—'}${work.to ? '<br>' + work.to : ''}</div><div class="tl-node"></div>
        <button class="fact-card" data-fact-order="${order.id}">
          <div class="spread">
            <span><span class="chip" style="color:${tColor(work.type)};border-color:${tColor(work.type)}">${esc(work.type)}</span>
            <span class="badge-order" style="margin-left:6px">№${esc(order.num)}</span></span>
            <span class="mono">${fmtMoney(workTotal(work))} ₽</span>
          </div>

        </button></div>`;
    }
    html += `</div>`;
  }
  return html;
}

/* ---------- Отчёт ---------- */
function buildReport(o) {
  let out = `Заказ ${o.num}\n`;
  for (const w of o.works) {
    out += '\n';
    let head = w.type;
    if (w.note) head += ' ' + w.note;
    if (w.date) head += ' ' + fmtD(w.date);
    if (w.from && w.to) head += ' ' + w.from + '-' + w.to;
    out += head + '\n';
    for (const l of w.lines) out += `${personName(l)} ${Number(l.amount)||0}\n`;
  }
  return out.trimEnd();
}
function renderReport() {
  const o = orderById(view.orderId);
  const text = buildReport(o);
  return `<button class="back" id="backBtn">← Назад к заказу</button>
    <div class="page-title" style="margin:4px 0 12px"><span class="emo">📋</span>Отчёт для HR</div>
    <div class="paper"><textarea id="reportText" readonly rows="${Math.min(24, text.split('\n').length + 1)}">${esc(text)}</textarea></div>
    <button class="btn btn-primary btn-big" id="copyReport">Скопировать отчёт</button>
    <div class="callout"><span class="emo">✉️</span><span>Вставь текст в мессенджер или письмо для HR.</span></div>`;
}

/* ---------- ЛЮДИ ---------- */
function renderPeople() {
  const e = view.editPerson;
  let html = `<div class="page-title"><span class="emo">👥</span>Бригада</div>
    <div class="card">
      <label style="margin-top:0">Имя и фамилия</label><input class="f" id="pName" value="${esc(e?e.name:'')}" placeholder="Петров Алексей">
      <label>Обычная ставка за смену, ₽</label><input class="f" id="pRate" type="number" inputmode="numeric" value="${esc(e?e.rate:'')}" placeholder="6000">
      <div class="row2">${e?'<button class="btn btn-ghost" id="cancelPerson">Отмена</button>':''}
      <button class="btn btn-primary" id="savePerson">${e?'Сохранить':'+ Добавить человека'}</button></div>
    </div>`;
  if (!D.people.length) html += `<div class="callout"><span class="emo">💡</span><span>Добавь бригаду — при создании работы ставка подставится автоматически.</span></div>`;
  for (const p of D.people) {
    html += `<div class="person-row">
      <button class="person-toggle" data-edit-person="${p.id}"><span style="font-weight:600">${esc(p.name)}</span></button>
      <span class="mono" style="white-space:nowrap;color:var(--dim)">${fmtMoney(p.rate)} ₽</span>
      ${view.confirm === 'delP' + p.id
        ? `<button class="btn btn-danger" style="min-height:40px;padding:8px 12px" data-del-person="${p.id}">Точно?</button>`
        : `<button class="del-x" data-ask-del-person="${p.id}">✕</button>`}
    </div>`;
  }
  html += `<div class="callout"><span class="emo">✏️</span><span>Нажми на имя, чтобы изменить. Прошлые работы при этом не пересчитываются.</span></div>`;
  return html;
}

/* ---------- СВОДКА ---------- */
function renderSummary() {
  if (!view.sumYm) view.sumYm = ymNow();
  const [year, month] = view.sumYm;
  const inMonth = (iso) => { if (!iso) return false; const [y,m] = iso.split('-').map(Number); return y===year && m===month+1; };
  const map = {}; const cashMap = {}; let total = 0, cashSum = 0; const orderSet = new Set(); let workCount = 0;
  for (const o of D.orders) {
    const active = o.works.some((w) => inMonth(w.date));
    for (const w of o.works) {
      if (!(inMonth(w.date) || (!w.date && active))) continue;
      workCount++; orderSet.add(o.id);
      for (const l of w.lines) {
        const n = personName(l); const a = Number(l.amount)||0; const c = lineCash(l);
        map[n]=(map[n]||0)+a; cashMap[n]=(cashMap[n]||0)+c; total+=a; cashSum+=c;
      }
    }
  }
  const kassa = total - cashSum;
  const rows = Object.entries(map).sort((a,b)=>b[1]-a[1]);
  let html = `<div class="page-title"><span class="emo">📊</span>Сводка</div>
    <div class="cal-head">
      <button class="cal-nav" data-nav="sum-1">‹</button>
      <div class="cal-title">${MONTHS[month]} ${year}</div>
      <button class="cal-nav" data-nav="sum+1">›</button>
    </div>
    <div class="card" style="text-align:center">
      <div style="color:var(--dim);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase">Заработано бригадой (по отчёту)</div>
      <div class="money-huge">${fmtMoney(total)} ₽</div>
      <div class="meta">${orderSet.size} ${plural(orderSet.size,'заказ','заказа','заказов')} · ${workCount} ${plural(workCount,'работа','работы','работ')}</div>
    </div>`;
  if (kassa) html += `<div class="stat-row">
      <div class="stat"><div class="lbl">Выдано на руки</div><div class="val" style="font-size:20px">${fmtMoney(cashSum)} ₽</div></div>
      <div class="stat" style="background:#FBF4EA;border-color:var(--sand)"><div class="lbl" style="color:var(--sand-dark)">💰 В кассу</div><div class="val" style="font-size:20px;color:var(--sand-dark)">${fmtMoney(kassa)} ₽</div></div>
    </div>`;
  if (!rows.length) html += `<div class="empty">В этом месяце работ не отмечено.</div>`;
  else html += `<div class="sec">По людям${kassa ? ' · отчёт → на руки' : ''}</div><div class="card">
    ${rows.map(([n,s])=>{ const c = cashMap[n]||0; const diff = s - c;
      return `<div class="line-row"><span>${esc(n)}</span><span class="mono">${fmtMoney(s)}${diff?` <span style="color:var(--sand-dark);font-weight:600">→ ${fmtMoney(c)}</span>`:''} ₽</span></div>`;
    }).join('')}</div>`;
  html += `<div class="callout"><span class="emo">💡</span><span>«По отчёту» уходит в HR, «на руки» — что реально выдано наличными, разница копится в кассе бригадира. Работы без даты попадают в месяц, если у их заказа есть работы в этом месяце.</span></div>`;
  return html;
}

/* ================= События ================= */
function bindMain() {
  const $ = (sel) => document.querySelector(sel);
  const $$ = (sel) => [...document.querySelectorAll(sel)];

  // навигация месяцев
  $$('[data-nav]').forEach((b) => b.addEventListener('click', () => {
    const [pfx, delta] = [b.dataset.nav.slice(0, -2), Number(b.dataset.nav.slice(-2))];
    const key = pfx === 'sum' ? 'sumYm' : 'ym';
    let [y, m] = view[key] || ymNow();
    m += delta; if (m < 0) { m = 11; y--; } if (m > 11) { m = 0; y++; }
    view[key] = [y, m]; if (key === 'ym') view.selDay = null;
    render();
  }));
  $$('.cal-cell[data-day]').forEach((b) => b.addEventListener('click', () => {
    const d = Number(b.dataset.day);
    view.selDay = view.selDay === d ? null : d; render();
  }));

  // главная: быстрые действия
  const qaO = $('#qaOrder'); if (qaO) qaO.addEventListener('click', () => { view.tab = 'orders'; view.addingOrder = true; render(); });
  const qaI = $('#qaImport'); if (qaI) qaI.addEventListener('click', () => document.getElementById('xlsInput').click());
  const qaC = $('#qaReportDay'); if (qaC) qaC.addEventListener('click', () => { view.tab = 'plan'; render(); });
  $$('[data-order-home]').forEach((b) => b.addEventListener('click', () => { view.tab = 'orders'; view.orderId = b.dataset.orderHome; render(); }));

  // план: импорт
  const imp = $('#importBtn');
  if (imp) imp.addEventListener('click', () => document.getElementById('xlsInput').click());

  // оформить из плана
  $$('[data-plan]').forEach((b) => b.addEventListener('click', () => {
    const p = D.plan.find((x) => x.id === b.dataset.plan);
    if (!p) return;
    let o = D.orders.find((x) => x.num === (p.order || ''));
    if (!o) { o = { id: uid(), num: p.order || '—', works: [] }; D.orders.unshift(o); }
    view.tab = 'orders'; view.orderId = o.id;
    view.work = { id: uid(), saved: false, planId: p.id, type: guessType(p.op), note: p.op, date: p.date, from: p.from || '', to: p.to || '', lines: [] };
    render();
  }));
  $$('[data-fact-order]').forEach((b) => b.addEventListener('click', () => {
    view.tab = 'orders'; view.orderId = b.dataset.factOrder; render();
  }));

  // заказы
  const addO = $('#addOrderBtn'); if (addO) addO.addEventListener('click', () => { view.addingOrder = true; render(); });
  const cO = $('#cancelOrder'); if (cO) cO.addEventListener('click', () => { view.addingOrder = false; render(); });
  const crO = $('#createOrder'); if (crO) crO.addEventListener('click', async () => {
    const num = $('#newOrderNum').value.trim(); if (!num) return;
    const o = { id: uid(), num, works: [] }; D.orders.unshift(o);
    view.addingOrder = false; view.orderId = o.id; await save(); render();
  });
  $$('[data-order]').forEach((b) => b.addEventListener('click', () => { view.orderId = b.dataset.order; view.confirm = null; render(); }));

  const back = $('#backBtn'); if (back) back.addEventListener('click', () => {
    if (view.work !== null) { view.work = null; }
    else if (view.report) { view.report = false; }
    else { view.orderId = null; }
    view.confirm = null; render();
  });

  const addW = $('#addWorkBtn'); if (addW) addW.addEventListener('click', () => {
    view.work = { id: uid(), saved: false, type: D.types[0], note: '', date: '', from: '', to: '', lines: [] }; render();
  });
  $$('[data-work]').forEach((b) => b.addEventListener('click', () => {
    const o = orderById(view.orderId); const w = o.works.find((x) => x.id === b.dataset.work);
    view.work = JSON.parse(JSON.stringify({ ...w, saved: true })); render();
  }));

  const rep = $('#reportBtn'); if (rep) rep.addEventListener('click', () => { view.report = true; render(); });
  const copy = $('#copyReport'); if (copy) copy.addEventListener('click', async () => {
    const ta = $('#reportText');
    try { await navigator.clipboard.writeText(ta.value); toast('Отчёт скопирован'); }
    catch { ta.select(); document.execCommand('copy'); toast('Отчёт скопирован'); }
  });

  const askDO = $('#askDelOrder'); if (askDO) askDO.addEventListener('click', () => { view.confirm = 'delOrder'; render(); });
  const doDO = $('#doDelOrder'); if (doDO) doDO.addEventListener('click', async () => {
    D.orders = D.orders.filter((o) => o.id !== view.orderId);
    view.orderId = null; view.confirm = null; await save(); render();
  });
  const cD = $('#cancelDel'); if (cD) cD.addEventListener('click', () => { view.confirm = null; render(); });

  // форма работы
  if (view.work !== null) {
    const w = view.work;
    const readFields = () => {
      const n = $('#wNote'); if (n) w.note = n.value;
      const dt = $('#wDate'); if (dt) w.date = dt.value || '';
      const f = $('#wFrom'); if (f) w.from = f.value || '';
      const t = $('#wTo'); if (t) w.to = t.value || '';
      $$('[data-amount]').forEach((inp) => {
        const l = w.lines.find((x) => x.personId === inp.dataset.amount);
        if (l) l.amount = inp.value;
      });
      $$('[data-cash]').forEach((inp) => {
        const l = w.lines.find((x) => x.personId === inp.dataset.cash);
        if (l) l.cash = inp.value;
      });
    };
    $$('[data-type]').forEach((b) => b.addEventListener('click', () => { readFields(); w.type = b.dataset.type; render(); }));
    const at = $('#addTypeBtn'); if (at) at.addEventListener('click', async () => {
      readFields();
      const t = prompt('Название типа работы:');
      if (t && t.trim()) { const tt = t.trim(); if (!D.types.includes(tt)) { D.types.push(tt); await save(); } w.type = tt; }
      render();
    });
    $$('[data-person]').forEach((b) => b.addEventListener('click', () => {
      readFields();
      const p = D.people.find((x) => x.id === b.dataset.person);
      if (w.lines.some((l) => l.personId === p.id)) w.lines = w.lines.filter((l) => l.personId !== p.id);
      else w.lines.push({ personId: p.id, name: p.name, amount: p.rate || 0, cash: p.rate || 0 });
      render();
    }));
    $$('[data-amount]').forEach((inp) => inp.addEventListener('input', () => {
      const l = w.lines.find((x) => x.personId === inp.dataset.amount);
      if (l) l.amount = inp.value;
    }));
    $$('[data-cash]').forEach((inp) => inp.addEventListener('input', () => {
      const l = w.lines.find((x) => x.personId === inp.dataset.cash);
      if (l) l.cash = inp.value;
    }));
    const sv = $('#saveWork'); if (sv) sv.addEventListener('click', async () => {
      readFields();
      if (!w.lines.length) return;
      const clean = { id: w.id, planId: w.planId || null, type: w.type, note: w.note.trim(), date: w.date || null, from: w.from, to: w.to,
        lines: w.lines.map((l) => ({ ...l, amount: Number(l.amount) || 0, cash: l.cash == null || l.cash === '' ? (Number(l.amount) || 0) : (Number(l.cash) || 0) })) };
      const o = orderById(view.orderId);
      const idx = o.works.findIndex((x) => x.id === w.id);
      if (idx >= 0) o.works[idx] = clean; else o.works.push(clean);
      view.work = null; await save(); render(); toast('Сохранено');
    });
    const askDW = $('#askDelWork'); if (askDW) askDW.addEventListener('click', () => { readFields(); view.confirm = 'delWork'; render(); });
    const doDW = $('#doDelWork'); if (doDW) doDW.addEventListener('click', async () => {
      const o = orderById(view.orderId);
      o.works = o.works.filter((x) => x.id !== w.id);
      view.work = null; view.confirm = null; await save(); render();
    });
  }

  // люди
  const sp = $('#savePerson'); if (sp) sp.addEventListener('click', async () => {
    const name = $('#pName').value.trim(); const rate = Number($('#pRate').value) || 0;
    if (!name) return;
    if (view.editPerson) {
      const p = D.people.find((x) => x.id === view.editPerson.id);
      if (p) { p.name = name; p.rate = rate; }
      view.editPerson = null;
    } else D.people.push({ id: uid(), name, rate });
    await save(); render();
  });
  const cp = $('#cancelPerson'); if (cp) cp.addEventListener('click', () => { view.editPerson = null; render(); });
  $$('[data-edit-person]').forEach((b) => b.addEventListener('click', () => {
    view.editPerson = { ...D.people.find((x) => x.id === b.dataset.editPerson) }; render();
  }));
  $$('[data-ask-del-person]').forEach((b) => b.addEventListener('click', () => { view.confirm = 'delP' + b.dataset.askDelPerson; render(); }));
  $$('[data-del-person]').forEach((b) => b.addEventListener('click', async () => {
    D.people = D.people.filter((p) => p.id !== b.dataset.delPerson);
    view.confirm = null; await save(); render();
  }));
}

/* импорт файла */
document.getElementById('xlsInput').addEventListener('change', async (e) => {
  const file = e.target.files[0]; e.target.value = '';
  if (!file) return;
  let XLSX;
  try { XLSX = await ensureXLSX(); }
  catch { toast('Нужен интернет для чтения файла — попробуй ещё раз'); return; }
  try {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf);
    const events = parsePlanWorkbook(wb, XLSX);
    if (!events.length) { toast('Монтажей и демонтажей в файле не нашлось'); return; }
    const dates = events.map((x) => x.date).sort();
    const [lo, hi] = [dates[0], dates[dates.length - 1]];
    const kept = D.plan.filter((p) => p.date < lo || p.date > hi);
    D.plan = [...kept, ...events].sort((a, b) => (a.date + a.from).localeCompare(b.date + b.from));
    await save();
    const [y, m] = lo.split('-').map(Number);
    view.tab = 'plan'; view.ym = [y, m - 1]; view.selDay = Number(lo.split('-')[2]);
    render();
    toast(`Загружено: ${events.length} соб., ${fmtD(lo)}–${fmtD(hi)}`);
  } catch (err) { toast('Не удалось прочитать файл'); }
});

/* ================= Старт ================= */
function freshData() { return { people: [], types: [...DEFAULT_TYPES], orders: [], plan: [] }; }
const withTimeout = (p, ms) => Promise.race([p, new Promise((r) => setTimeout(() => r(null), ms))]);

(async () => {
  let loaded = null;
  try { loaded = await withTimeout(loadData(), 4000); } catch { loaded = null; }
  D = loaded && loaded.orders ? loaded : freshData();
  if (!D.people) D.people = [];
  if (!D.orders) D.orders = [];
  if (!D.plan) D.plan = [];
  if (!D.types) D.types = [...DEFAULT_TYPES];
  if (!D.types.includes('Склад')) D.types.splice(3, 0, 'Склад');
  render();
})();

// подстраховка: если что-то выше упало до render, всё равно показать интерфейс
setTimeout(() => {
  if (!document.querySelector('#tabbar button')) {
    if (!D) D = freshData();
    try { render(); } catch (e) {}
  }
}, 4500);
</script>
